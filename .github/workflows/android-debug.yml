name: Android Debug Build

on:
  push:
    branches:
      - main
      - refactor
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🧾 Prepare debug APK metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="atmik-ai-debug-${VERSION}-${SHORT_SHA}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "Debug APK: ${APK_NAME}"

      - name: 🔨 Build Android Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC' -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: 📦 Rename debug APK
        shell: bash
        run: |
          mkdir -p /tmp/debug-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK was generated"
            find android/app/build/outputs -maxdepth 5 -type f | sed -n '1,40p'
            exit 1
          fi
          cp "$APK_PATH" "/tmp/debug-apk/${{ steps.meta.outputs.apk_name }}.apk"
          ls -l /tmp/debug-apk

      - name: 🚀 Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmik-ai-debug-${{ github.run_number }}
          path: /tmp/debug-apk/*.apk
          retention-days: 7
