name: Android Release Build

on:
  push:
    branches:
      - main
      - refactor
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🚀 Expand Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 🔐 Setup Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
          else
            echo "No keystore secret found, skipping."
          fi
          
      - name: 🔨 Build Android Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC' -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 📋 Rename APK
        run: |
          mkdir -p /tmp/release-apk
          find ../android/app/build/outputs/apk -name "*.apk" | head -1 | xargs -I{} cp {} /tmp/release-apk/atmik-ai.apk

      - name: 🏷 Create Git Tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="build-$(date +'%Y%m%d')-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" || echo "Tag already exists, skipping."
          git push origin "${TAG}" || echo "Tag push skipped."
        working-directory: .

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Atmik AI – ${{ steps.tag.outputs.tag }}"
          body: |
            ## 📦 Atmik AI Android Build

            **Branch:** `${{ github.ref_name }}`  
            **Commit:** `${{ github.sha }}`  
            **Built at:** ${{ github.event.head_commit.timestamp || 'manual trigger' }}

            ### What's in this release
            ${{ github.event.head_commit.message || 'Manual workflow dispatch build' }}

            ---
            > ⚠️ This is an automated build. Install only on trusted devices.
          files: /tmp/release-apk/atmik-ai.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmik-ai-apk
          path: /tmp/release-apk/atmik-ai.apk
          retention-days: 14
